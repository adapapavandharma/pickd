name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sanity-check the catalogue
        run: node -e "const d=require('./data/products.json');if(!Array.isArray(d.products)||!d.products.length)throw new Error('products.json is empty');d.products.forEach(p=>{if(!p.id||!p.title||!p.url)throw new Error('incomplete product: '+JSON.stringify(p.id))});console.log(d.products.length+' products OK')"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
